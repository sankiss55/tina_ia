<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MediaPipe Object Detection - Live Stream</title>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: sans-serif;
      overflow: hidden; /* Evitar scroll */
    }

    /* Contenedor para superponer canvas sobre video */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      position: absolute;
      width: 640px;
      height: 480px;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
    }

    canvas {
      position: absolute;
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* Efecto espejo igual que el video */
      z-index: 10; /* Encima del video */
    }

    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #00ffcc;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 20;
      font-weight: bold;
    }
    
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="status">Cargando MediaPipe...</div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script type="module">
    import {
      ObjectDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    let objectDetector;
    let runningMode = "VIDEO"; // 🔥 ESTA ES LA CLAVE (Live Stream)
    let lastVideoTime = -1;

    // 1. Inicializar el Detector de MediaPipe
    const initializeObjectDetector = async () => {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
      );

      objectDetector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: {
          // Usamos el modelo "Lite" oficial de Google para demos rápidas
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite`,
          delegate: "GPU" // 🔥 Forzar uso de GPU
        },
        scoreThreshold: 0.5, // Confianza mínima (50%)
        runningMode: runningMode
      });

      statusText.innerText = "Sistema Listo. Activa la cámara.";
      enableCam();
    };

    // 2. Activar Webcam
    const enableCam = async () => {
      if (!objectDetector) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.addEventListener("loadeddata", predictWebcam);
        statusText.innerText = "Detectando objetos...";
        statusText.style.color = "#00ff00";
      } catch (err) {
        console.error(err);
        statusText.innerText = "Error: No se pudo acceder a la cámara";
      }
    };

    // 3. Bucle de Predicción (Loop)
    async function predictWebcam() {
      // Ajustar tamaño del canvas al video real
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      let startTimeMs = performance.now();

      // Detectar solo si el frame ha cambiado
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        
        // 🔥 AQUÍ OCURRE LA MAGIA: detectForVideo
        const detections = objectDetector.detectForVideo(video, startTimeMs);
        
        // Dibujar resultados
        displayVideoDetections(detections);
      }

      // Volver a llamar lo más rápido posible (requestAnimationFrame)
      window.requestAnimationFrame(predictWebcam);
    }

    // 4. Dibujar Cajas
    function displayVideoDetections(result) {
      // Limpiar canvas anterior
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const detection of result.detections) {
        // Coordenadas de la caja
        const { originX, originY, width, height } = detection.boundingBox;
        
        // Categoría (ej: "person", "cup")
        const category = detection.categories[0];
        const scorePct = Math.round(category.score * 100);

        // Dibujar Rectángulo
        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 4;
        ctx.strokeRect(originX, originY, width, height);

        // Dibujar Fondo del texto
        ctx.fillStyle = "#00FF00";
        ctx.font = "16px Arial";
        const text = `${category.categoryName} ${scorePct}%`;
        const textWidth = ctx.measureText(text).width;
        ctx.fillRect(originX, originY - 25, textWidth + 10, 25);

        // Dibujar Texto
        ctx.fillStyle = "black";
        ctx.fillText(text, originX + 5, originY - 7);
      }
    }

    // Arrancar todo
    initializeObjectDetector();

  </script>
</body>
</html>
