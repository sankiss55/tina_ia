<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YOLO Real-Time GitHub</title>
  <style>
    body { margin: 0; background: #000; font-family: sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
    .video-container { position: relative; width: 640px; height: 480px; background: #111; margin-top: 20px; }
    video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
    #status { padding: 10px; background: #222; width: 100%; text-align: center; font-family: monospace; }
    button { 
      padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 50px; border: none;
      background: #00ffcc; color: black; font-weight: bold; margin-top: 20px;
    }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="status">CARGANDO MODELO IA...</div>
  
  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <button id="btnStart" disabled>ESPERA...</button>

  <script type="module">
    import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output_canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");
    const btnStart = document.getElementById("btnStart");

    let objectDetector;
    let lastVideoTime = -1;

    // 1. Inicializar MediaPipe
    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
        );
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite`,
            delegate: "GPU"
          },
          scoreThreshold: 0.5,
          runningMode: "VIDEO"
        });
        statusText.innerText = "MODELO CARGADO ✅";
        btnStart.innerText = "ACTIVAR CÁMARA";
        btnStart.disabled = false;
      } catch (err) {
        statusText.innerText = "ERROR AL CARGAR: " + err;
      }
    }

    // 2. Función de Predicción
    function predict() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const detections = objectDetector.detectForVideo(video, performance.now());
        draw(detections);
      }
      window.requestAnimationFrame(predict);
    }

    // 3. Dibujar en Canvas
    function draw(result) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      result.detections.forEach(detection => {
        const { originX, originY, width, height } = detection.boundingBox;
        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 4;
        ctx.strokeRect(originX, originY, width, height);
        
        ctx.fillStyle = "#00FF00";
        ctx.font = "18px Arial";
        ctx.fillText(`${detection.categories[0].categoryName} ${Math.round(detection.categories[0].score * 100)}%`, originX, originY - 10);
      });
    }

    // 4. Evento del botón
    btnStart.addEventListener("click", async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        predict();
        btnStart.style.display = "none";
        statusText.innerText = "DETECTANDO EN TIEMPO REAL";
      };
    });

    init();
  </script>
</body>
</html>
